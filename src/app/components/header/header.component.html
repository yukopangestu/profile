<ng-template #navItemTpl let-item let-base="base">
  @if (isPageLink(item)) {
    <a
      [routerLink]="item.href"
      (click)="menuOpen.set(false)"
      [class]="navClass(item, base)"
      [attr.aria-current]="isItemActive(item) ? 'page' : null"
      >{{ item.label }}</a
    >
  } @else if (!isHome()) {
    <a
      [href]="offHomeAnchorHref(item)"
      (click)="menuOpen.set(false)"
      [class]="navClass(item, base)"
      [attr.aria-current]="isItemActive(item) ? 'page' : null"
      >{{ item.label }}</a
    >
  } @else {
    <button
      (click)="handleAnchorNav(item.href, item.id)"
      [class]="navClass(item, base)"
      [attr.aria-current]="isItemActive(item) ? 'true' : null"
    >
      {{ item.label }}
    </button>
  }
</ng-template>

<header class="sticky top-0 z-50 border-b border-term-dim bg-[rgba(6,11,22,0.85)] backdrop-blur-md font-mono text-[13px]">
  <div class="flex justify-between items-center gap-4 px-5 sm:px-6 md:px-14 py-[18px] max-w-content mx-auto">
    @if (isHome()) {
      <button
        (click)="handleAnchorNav('#home', 'home')"
        class="text-terminal-blue font-bold hover:text-terminal-blue-bright transition-colors shrink-0 text-[12px] sm:text-[13px]"
      >
        ~/yuko-pangestu
      </button>
    } @else {
      <a
        routerLink="/"
        class="text-terminal-blue font-bold hover:text-terminal-blue-bright transition-colors shrink-0 text-[12px] sm:text-[13px]"
      >
        ~/yuko-pangestu
      </a>
    }

    <!-- Desktop nav — lg+ so tablet doesn't crush 6 links + CTA -->
    <nav class="hidden lg:flex items-center gap-6 xl:gap-[30px]" aria-label="Primary">
      @for (item of navItems; track item.href) {
        <ng-container [ngTemplateOutlet]="navItemTpl" [ngTemplateOutletContext]="{ $implicit: item, base: '' }" />
      }
    </nav>

    <div class="flex items-center gap-3 sm:gap-4 shrink-0">
      <a
        href="mailto:yuko.pangestu@gmail.com"
        class="hidden lg:inline-block border border-terminal-primary text-terminal-blue px-[18px] py-2 rounded hover:bg-terminal-primary hover:text-white transition-colors"
      >
        hire --me
      </a>
      <button
        class="lg:hidden text-terminal-dim p-1 hover:text-terminal-text"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
        [attr.aria-expanded]="menuOpen()"
      >
        <span class="font-mono text-sm">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div id="mobile-menu" class="lg:hidden flex flex-col px-5 sm:px-6 pb-6 gap-1 border-t border-term-dim">
      @for (item of navItems; track item.href) {
        <ng-container
          [ngTemplateOutlet]="navItemTpl"
          [ngTemplateOutletContext]="{ $implicit: item, base: 'text-left py-3 border-b border-term-dim last:border-0' }"
        />
      }
      <a
        href="mailto:yuko.pangestu@gmail.com"
        class="border border-terminal-primary text-terminal-blue px-[18px] py-3 rounded text-center mt-3 hover:bg-terminal-primary hover:text-white transition-colors"
      >
        hire --me
      </a>
    </div>
  }
</header>
