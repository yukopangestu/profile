<section id="skills" class="border-t border-term-dim">
  <div class="max-w-content mx-auto px-5 sm:px-6 md:px-14 py-14 sm:py-16 md:py-[88px]">
    <div class="section-label">// what i bring</div>
    <h2 class="m-0 mb-8 sm:mb-10 text-[28px] sm:text-[32px] md:text-[44px] font-bold tracking-[-0.02em]">
      Technical Ecosystem
    </h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-[22px]">
      @for (group of skillGroups; track group.title) {
        <div class="bg-terminal-surface border border-term rounded-lg overflow-hidden hover:border-term-hover transition-colors">
          <app-terminal-chrome [title]="group.file" size="sm" />
          <div class="px-5 py-[22px]">
            <h3 class="m-0 mb-2.5 text-[18px] sm:text-[19px] font-bold">{{ group.title }}</h3>
            <p class="m-0 mb-[18px] text-sm leading-[1.65] text-terminal-dim">
              {{ group.description }}
            </p>
            <div class="flex flex-wrap gap-[7px] font-mono text-[11px]">
              @for (tag of group.tags; track tag) {
                <span class="border border-term-strong text-terminal-blue px-[9px] py-1 rounded-sm">
                  {{ tag }}
                </span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
