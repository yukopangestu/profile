<button
  (click)="scrollToTop()"
  aria-label="Back to top"
  [class]="
    'fixed bottom-6 right-5 sm:bottom-8 sm:right-8 z-50 flex items-center justify-center w-11 h-11 rounded-full border border-term-mid bg-terminal-surface/90 backdrop-blur-md text-terminal-blue font-mono hover:border-terminal-blue hover:text-white hover:bg-terminal-primary transition-all duration-300 ' +
    (visible() ? 'opacity-100 translate-y-0 pointer-events-auto' : 'opacity-0 translate-y-2 pointer-events-none')
  "
>
  ↑
</button>
