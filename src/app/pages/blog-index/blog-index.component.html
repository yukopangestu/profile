<main class="max-w-content mx-auto px-5 sm:px-6 md:px-14 pt-14 sm:pt-16 md:pt-[88px] pb-14 sm:pb-16 md:pb-[88px]">
  <div class="section-label">// blog</div>
  <h1 class="m-0 mb-3 text-[28px] sm:text-[32px] md:text-[44px] font-bold tracking-[-0.02em]">
    Writing<span class="text-terminal-primary">.</span>
  </h1>
  <p class="m-0 mb-10 sm:mb-12 max-w-[480px] text-[15px] sm:text-[15.5px] leading-[1.7] text-terminal-muted">
    Notes on engineering, leadership, and building things.
  </p>

  @if (posts().length === 0) {
    <p class="font-mono text-sm text-terminal-dim">// no posts yet — check back soon</p>
  } @else {
    <ul class="flex flex-col gap-0">
      @for (post of posts(); track post.slug) {
        <li class="border-t border-term-dim last:border-b">
          <a [routerLink]="['/blog', post.slug]" class="group block py-6 sm:py-7">
            <time class="font-mono text-xs text-terminal-faint">{{ formatDate(post.date) }}</time>
            <h2 class="mt-1.5 mb-2 text-xl sm:text-2xl font-bold tracking-[-0.01em] text-terminal-text group-hover:text-terminal-blue transition-colors">
              {{ post.title }}
            </h2>
            <p class="m-0 text-[14.5px] sm:text-[15px] leading-[1.7] text-terminal-muted">
              {{ post.excerpt }}
            </p>
          </a>
        </li>
      }
    </ul>
  }
</main>
